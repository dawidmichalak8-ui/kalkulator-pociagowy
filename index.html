<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kosztów Pociągowych PKP PLK</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="stations.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        brand: '#3b82f6',
                        brandHover: '#2563eb'
                    }
                }
            }
        }
    </script>
    <style>
        /* Styl dla suwaków */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer;
            background: #475569;
            border-radius: 3px;
        }
        .autocomplete-items {
            position: absolute; border: 1px solid #334155;
            border-bottom: none; border-top: none; z-index: 99;
            top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto;
        }
        .autocomplete-items div {
            padding: 10px; cursor: pointer; background-color: #1e293b;
            border-bottom: 1px solid #334155; color: white;
        }
        .autocomplete-items div:hover { background-color: #3b82f6; }
    </style>
</head>
<body class="bg-darkbg text-slate-200 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-cardbg border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-train text-brand text-2xl"></i>
            <h1 class="text-xl font-bold text-white tracking-wide">TrainCost <span class="font-light text-brand">Analyzer</span></h1>
        </div>
        <button onclick="togglePanel()" class="bg-brand hover:bg-brandHover text-white px-4 py-2 rounded shadow transition flex items-center gap-2">
            <i class="fa-solid fa-sliders"></i> Stawki i wskaźniki
        </button>
    </header>

    <!-- Główny Kontener -->
    <main class="container mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 relative">
        
        <!-- Lewa Kolumna: Parametry Trasy -->
        <div class="lg:col-span-4 space-y-6">
            
            <!-- Wyszukiwarka Trasy -->
            <div class="bg-cardbg p-5 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-lg font-semibold text-white mb-4 border-b border-slate-600 pb-2"><i class="fa-solid fa-route text-brand mr-2"></i>Trasa (API PLK)</h2>
                
                <div class="space-y-4 relative">
                    <div class="relative">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Stacja początkowa (A)</label>
                        <input type="text" id="stationA" placeholder="np. Gdańsk Port Północny" class="w-full bg-darkbg border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-brand" autocomplete="off" oninput="showSuggestions(this.value, 'stationA')">
                        <div id="suggestionsA" class="autocomplete-items hidden"></div>
                    </div>
                    
                    <div class="relative">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Stacja końcowa (B)</label>
                        <input type="text" id="stationB" placeholder="np. Kąty Wrocławskie" class="w-full bg-darkbg border border-slate-600 rounded p-2 text-white focus:outline-none focus:border-brand" autocomplete="off" oninput="showSuggestions(this.value, 'stationB')">
                        <div id="suggestionsB" class="autocomplete-items hidden"></div>
                    </div>

                    <button onclick="fetchDistance()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass-location"></i> Wyznacz trasę (API)
                    </button>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Dystans (km)</label>
                        <input type="number" id="distanceInput" value="0" class="w-full bg-darkbg border border-brand rounded p-2 text-white font-bold text-lg focus:outline-none focus:ring-1 focus:ring-brand" oninput="calculateCosts()">
                        <p class="text-xs text-slate-500 mt-1">Jeśli API nie odpowie, wpisz dystans ręcznie.</p>
                    </div>
                </div>
            </div>

            <!-- Parametry Pociągu -->
            <div class="bg-cardbg p-5 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-lg font-semibold text-white mb-4 border-b border-slate-600 pb-2"><i class="fa-solid fa-train-tram text-brand mr-2"></i>Parametry Pociągu</h2>
                
                <div class="space-y-5">
                    <div>
                        <div class="flex justify-between">
                            <label class="text-sm font-medium text-slate-300">Masa brutto pociągu</label>
                            <span class="text-brand font-bold" id="grossWeightVal">1800 t</span>
                        </div>
                        <input type="range" id="grossWeight" min="600" max="2400" step="50" value="1800" class="w-full mt-2" oninput="document.getElementById('grossWeightVal').innerText=this.value+' t'; calculateCosts()">
                    </div>

                    <div>
                        <div class="flex justify-between">
                            <label class="text-sm font-medium text-slate-300">Liczba wagonów</label>
                            <span class="text-brand font-bold" id="wagonsVal">40</span>
                        </div>
                        <input type="range" id="wagons" min="10" max="45" step="1" value="40" class="w-full mt-2" oninput="document.getElementById('wagonsVal').innerText=this.value; calculateCosts()">
                    </div>

                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Typ relacji</label>
                            <select id="tripType" class="w-full bg-darkbg border border-slate-600 rounded p-2 text-white focus:outline-none" onchange="calculateCosts()">
                                <option value="oneway">W jedną stronę</option>
                                <option value="roundtrip">Tam i z powrotem</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Własność wagonów</label>
                            <select id="wagonOwnership" class="w-full bg-darkbg border border-slate-600 rounded p-2 text-white focus:outline-none" onchange="calculateCosts()">
                                <option value="client">Klienta (0 zł)</option>
                                <option value="leased">Dzierżawa (koszt)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Prawa Kolumna: Dashboard / Wyniki -->
        <div class="lg:col-span-8 space-y-6">
            <!-- Główne KPI -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-cardbg p-5 rounded-xl border border-slate-700 shadow-lg text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-brand"></div>
                    <p class="text-slate-400 text-sm uppercase font-bold tracking-wider mb-2">Całkowity Koszt (Netto)</p>
                    <p class="text-3xl font-extrabold text-white" id="resTotal">0.00 <span class="text-lg font-normal text-slate-400">PLN</span></p>
                </div>
                <div class="bg-cardbg p-5 rounded-xl border border-slate-700 shadow-lg text-center">
                    <p class="text-slate-400 text-sm uppercase font-bold tracking-wider mb-2">Koszt / 1 kilometr</p>
                    <p class="text-3xl font-extrabold text-brand" id="resPerKm">0.00 <span class="text-lg font-normal text-slate-400">PLN/km</span></p>
                </div>
                <div class="bg-cardbg p-5 rounded-xl border border-slate-700 shadow-lg text-center">
                    <p class="text-slate-400 text-sm uppercase font-bold tracking-wider mb-2">Koszt / 1 wagon</p>
                    <p class="text-3xl font-extrabold text-brand" id="resPerWagon">0.00 <span class="text-lg font-normal text-slate-400">PLN/wg</span></p>
                </div>
            </div>

            <!-- Wykresy i Tabela -->
            <div class="bg-cardbg p-5 rounded-xl border border-slate-700 shadow-lg grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                <div class="h-64 flex justify-center">
                    <canvas id="costChart"></canvas>
                </div>
                <div>
                    <h3 class="text-lg font-semibold text-white mb-4 border-b border-slate-600 pb-2">Struktura Kosztów</h3>
                    <ul class="space-y-3" id="costList">
                        <!-- Generowane dynamicznie przez JS -->
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- Zwijany Panel: Stawki i wskaźniki -->
    <div id="ratesPanel" class="fixed top-0 right-0 h-full w-full md:w-96 bg-cardbg shadow-2xl border-l border-slate-700 transform translate-x-full transition-transform duration-300 z-50 overflow-y-auto">
        <div class="p-5 flex justify-between items-center border-b border-slate-700 sticky top-0 bg-cardbg z-10">
            <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-calculator text-brand mr-2"></i>Stawki i wskaźniki</h2>
            <button onclick="togglePanel()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <div class="p-5 space-y-4">
            <div class="bg-darkbg p-3 rounded border border-slate-700">
                <label class="block text-xs font-medium text-slate-400 mb-1">Kurs EUR/PLN</label>
                <input type="number" step="0.01" id="rateEur" value="4.32" class="w-full bg-transparent text-white border-b border-slate-600 focus:outline-none focus:border-brand py-1" oninput="calculateCosts()">
            </div>
            
            <div class="bg-darkbg p-3 rounded border border-slate-700">
                <label class="block text-xs font-medium text-slate-400 mb-1">Stawka dostępu PKP PLK (PLN/pkm)</label>
                <input type="number" step="0.1" id="ratePlk" value="18.50" class="w-full bg-transparent text-white border-b border-slate-600 focus:outline-none focus:border-brand py-1" oninput="calculateCosts()">
            </div>
            
            <div class="bg-darkbg p-3 rounded border border-slate-700">
                <label class="block text-xs font-medium text-slate-400 mb-1">Koszt energii PGE (PLN / 1000 brtkm)</label>
                <input type="number" step="0.1" id="ratePge" value="26.00" class="w-full bg-transparent text-white border-b border-slate-600 focus:outline-none focus:border-brand py-1" oninput="calculateCosts()">
            </div>
            
            <div class="bg-darkbg p-3 rounded border border-slate-700">
                <label class="block text-xs font-medium text-slate-400 mb-1">Praca Maszynisty (PLN/h)</label>
                <input type="number" step="1" id="rateDriver" value="160" class="w-full bg-transparent text-white border-b border-slate-600 focus:outline-none focus:border-brand py-1" oninput="calculateCosts()">
            </div>

            <div class="bg-darkbg p-3 rounded border border-slate-700">
                <label class="block text-xs font-medium text-slate-400 mb-1">Dzierżawa Lokomotywy (PLN/doba)</label>
                <input type="number" step="100" id="rateLocoLease" value="4800" class="w-full bg-transparent text-white border-b border-slate-600 focus:outline-none focus:border-brand py-1" oninput="calculateCosts()">
            </div>

            <div class="bg-darkbg p-3 rounded border border-slate-700">
                <label class="block text-xs font-medium text-slate-400 mb-1">Utrzymanie ECM Lokomotywy (EUR/km)</label>
                <input type="number" step="0.01" id="rateLocoEcm" value="0.85" class="w-full bg-transparent text-white border-b border-slate-600 focus:outline-none focus:border-brand py-1" oninput="calculateCosts()">
            </div>
            
            <div class="bg-darkbg p-3 rounded border border-slate-700">
                <label class="block text-xs font-medium text-slate-400 mb-1">Koszty Ogólnego Zarządu (%)</label>
                <input type="number" step="0.1" id="rateOverhead" value="5.0" class="w-full bg-transparent text-white border-b border-slate-600 focus:outline-none focus:border-brand py-1" oninput="calculateCosts()">
            </div>
        </div>
    </div>
    
    <!-- Overlay przy otwartym panelu -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 transition-opacity" onclick="togglePanel()"></div>

    <script>
        let myChart = null;

        function togglePanel() {
            const panel = document.getElementById('ratesPanel');
            const overlay = document.getElementById('overlay');
            if(panel.classList.contains('translate-x-full')) {
                panel.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                panel.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function showSuggestions(val, inputId) {
            const listId = inputId === 'stationA' ? 'suggestionsA' : 'suggestionsB';
            const list = document.getElementById(listId);
            list.innerHTML = '';
            if (!val) { list.classList.add('hidden'); return; }
            
            let matches = stations.filter(s => s.toLowerCase().includes(val.toLowerCase()));
            if(matches.length > 0) {
                list.classList.remove('hidden');
                matches.forEach(match => {
                    let div = document.createElement('div');
                    div.innerHTML = match;
                    div.onclick = function() {
                        document.getElementById(inputId).value = match;
                        list.classList.add('hidden');
                    }
                    list.appendChild(div);
                });
            } else {
                list.classList.add('hidden');
            }
        }

        // Komunikacja z API Backendowym na Vercel (zabezpieczone zapytanie do PLK)
        async function fetchDistance() {
            const btn = document.querySelector('button[onclick="fetchDistance()"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Łączenie z API...';
            
            const start = document.getElementById('stationA').value;
            const end = document.getElementById('stationB').value;

            try {
                // Uderzamy do naszego pliku plk.js
                const res = await fetch(`/api/plk?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
                const rawText = await res.text(); // Pobieramy SUROWĄ odpowiedź, cokolwiek to jest
                
                try {
                    // Próbujemy to przeczytać jako normalne dane
                    const data = JSON.parse(rawText);
                    if(res.ok && data.distance) {
                        document.getElementById('distanceInput').value = data.distance;
                        calculateCosts();
                    } else {
                        alert(`Odpowiedź z serwera:\n${data.error || 'Nieznany błąd'}`);
                    }
                } catch (parseErr) {
                    // Jeśli to nie są dane (tylko np. błąd 404 lub 500 od Vercela), pokażemy go na ekranie!
                    alert(`KRYTYCZNY BŁĄD VERCELA (Kod ${res.status}):\n\n${rawText.substring(0, 300)}`);
                }
            } catch (err) {
                console.error(err);
                alert(`Całkowity błąd połączenia: ${err.message}`);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass-location"></i> Wyznacz trasę (API)';
            }
        }
        // Główny silnik kalkulacyjny wzorowany na plikach Excel
        function calculateCosts() {
            const dist = parseFloat(document.getElementById('distanceInput').value) || 0;
            if(dist === 0) return;

            // Parametry pociągu
            const gw = parseFloat(document.getElementById('grossWeight').value);
            const wags = parseFloat(document.getElementById('wagons').value);
            const tripType = document.getElementById('tripType').value;
            const multiplier = tripType === 'roundtrip' ? 2 : 1;
            const totalDist = dist * multiplier;
            
            // Stawki
            const eur = parseFloat(document.getElementById('rateEur').value);
            const plkRate = parseFloat(document.getElementById('ratePlk').value);
            const pgeRate = parseFloat(document.getElementById('ratePge').value);
            const driverRate = parseFloat(document.getElementById('rateDriver').value);
            const locoLease = parseFloat(document.getElementById('rateLocoLease').value);
            const locoEcm = parseFloat(document.getElementById('rateLocoEcm').value);
            const overheadPct = parseFloat(document.getElementById('rateOverhead').value) / 100;
            const isLeasedWagon = document.getElementById('wagonOwnership').value === 'leased';

            // Założenia Czasowe (Średnia prędk. handlowa 40km/h + odprawy/manewry 12h per obieg)
            const hours = (totalDist / 40) + (12 * multiplier);
            const days = hours / 24;

            // Obliczenia cząstkowe
            const costPLK = totalDist * plkRate;
            const costPGE = (gw * totalDist / 1000) * pgeRate; // na bazie pliku Energia od Dziarnowskiego
            const costLoco = (locoLease * days) + (locoEcm * eur * totalDist); // na bazie pliku Clip Intermodal
            const costDriver = driverRate * hours;
            const costWagons = isLeasedWagon ? (wags * 100 * days) : 0; // zakładamy 100 PLN/doba/wagon dzierżawy

            const sumDirect = costPLK + costPGE + costLoco + costDriver + costWagons;
            const costOverhead = sumDirect * overheadPct;
            const totalCost = sumDirect + costOverhead;

            // Wskaźniki
            document.getElementById('resTotal').innerText = totalCost.toLocaleString('pl-PL', {minimumFractionDigits: 2, maximumFractionDigits:2});
            document.getElementById('resPerKm').innerText = (totalCost / totalDist).toLocaleString('pl-PL', {minimumFractionDigits: 2, maximumFractionDigits:2});
            document.getElementById('resPerWagon').innerText = (totalCost / wags).toLocaleString('pl-PL', {minimumFractionDigits: 2, maximumFractionDigits:2});

            renderChart([costPLK, costPGE, costLoco, costDriver, costWagons, costOverhead]);
            updateCostList([
                { name: 'Dostęp PKP PLK', val: costPLK, color: '#3b82f6' },
                { name: 'Energia PGE', val: costPGE, color: '#eab308' },
                { name: 'Lokomotywa (Leasing + ECM)', val: costLoco, color: '#ef4444' },
                { name: 'Drużyna Trakcyjna', val: costDriver, color: '#a855f7' },
                { name: 'Wagony', val: costWagons, color: '#22c55e' },
                { name: 'Koszty Ogólne (Narzut)', val: costOverhead, color: '#94a3b8' }
            ], totalCost);
        }

        function updateCostList(data, total) {
            const list = document.getElementById('costList');
            list.innerHTML = '';
            data.forEach(item => {
                const pct = total > 0 ? ((item.val / total) * 100).toFixed(1) : 0;
                list.innerHTML += `
                    <li class="flex justify-between items-center bg-darkbg p-3 rounded border border-slate-700">
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full" style="background-color: ${item.color}"></span>
                            <span class="text-sm font-medium text-slate-200">${item.name}</span>
                        </div>
                        <div class="text-right">
                            <span class="block text-white font-bold">${item.val.toLocaleString('pl-PL', {minimumFractionDigits:2, maximumFractionDigits:2})} zł</span>
                            <span class="text-xs text-slate-400">${pct}%</span>
                        </div>
                    </li>`;
            });
        }

        function renderChart(dataArr) {
            const ctx = document.getElementById('costChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['PKP PLK', 'Energia', 'Lokomotywa', 'Drużyna', 'Wagony', 'Koszty Ogólne'],
                    datasets: [{
                        data: dataArr,
                        backgroundColor: ['#3b82f6', '#eab308', '#ef4444', '#a855f7', '#22c55e', '#94a3b8'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    cutout: '75%'
                }
            });
        }

        // Inicjalizacja wykresu zerowego
        calculateCosts();
    </script>
</body>
</html>
